[build]
  # Build command - run from root but build the web app
  command = "cd apps/web && pnpm run build"
  
  # Output directory - where Next.js outputs the built files
  publish = "apps/web/.next"

[build.environment]
  # Use pnpm
  NPM_FLAGS = "--version"
  
  # Node version
  NODE_VERSION = "22"
  
  # Enable pnpm
  NETLIFY_USE_PNPM = "true"
  

# Next.js plugin for Netlify
[[plugins]]
  package = "@netlify/plugin-nextjs"

# Redirects for Next.js
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
