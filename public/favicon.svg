<svg width="32" height="32" viewBox="0 0 32 32" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Orange gradient for gummy effect -->
    <radialGradient id="gummyOrange" cx="30%" cy="30%">
      <stop offset="0%" style="stop-color:#FFE4B5;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#FF8C00;stop-opacity:1" />
    </radialGradient>
    
    <!-- Purple outline gradient -->
    <linearGradient id="purpleOutline" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#9370DB;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#4B0082;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Main N with gummy style -->
  <rect x="2" y="8" width="6" height="16" rx="3" fill="url(#gummyOrange)" stroke="url(#purpleOutline)" stroke-width="1"/>
  
  <!-- OO as a single face (simplified) -->
  <ellipse cx="14" cy="16" rx="5" ry="8" fill="url(#gummyOrange)" stroke="url(#purpleOutline)" stroke-width="1"/>
  
  <!-- Eyes -->
  <ellipse cx="12.5" cy="14" rx="1.2" ry="1.5" fill="white"/>
  <ellipse cx="15.5" cy="14" rx="1.2" ry="1.5" fill="white"/>
  <circle cx="12.5" cy="14" r="0.6" fill="black"/>
  <circle cx="15.5" cy="14" r="0.6" fill="black"/>
  <circle cx="12.3" cy="13.8" r="0.2" fill="white"/>
  <circle cx="15.3" cy="13.8" r="0.2" fill="white"/>
  
  <!-- Glasses -->
  <ellipse cx="12.5" cy="14" rx="2" ry="2.5" fill="none" stroke="black" stroke-width="0.8"/>
  <ellipse cx="15.5" cy="14" rx="2" ry="2.5" fill="none" stroke="black" stroke-width="0.8"/>
  <line x1="14" y1="14" x2="14" y2="14" stroke="black" stroke-width="0.8"/>
  
  <!-- Main B with gummy style -->
  <rect x="18" y="8" width="6" height="16" rx="3" fill="url(#gummyOrange)" stroke="url(#purpleOutline)" stroke-width="1"/>
  
  <!-- Magic sparkles -->
  <polygon points="25,5 25.5,7 27.5,7.5 25.5,8 25,10 24.5,8 22.5,7.5 24.5,7" fill="#FFD700" opacity="0.8"/>
  <circle cx="27" cy="12" r="0.8" fill="#FFD700" opacity="0.6"/>
  
  <!-- Tiny pen tip -->
  <polygon points="26,20 27,21 25,22" fill="black"/>
  
  <!-- Glow effect -->
  <circle cx="16" cy="16" r="16" fill="none" stroke="#FFA500" stroke-width="0.5" opacity="0.3"/>
</svg>